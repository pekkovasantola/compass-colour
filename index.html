<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Shows a colour for the direction you are facing: blue is north, orange is south.">
<meta name="application-name" content="Compass Colour">
<meta name="mrbd-web-app-capable" content="yes">
<title>Compass Colour</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html, body, #app { inline-size: 100%; block-size: 100%; }

  body {
    margin: 0;
    overflow: hidden;
    background: #000; /* unlit on the additive display = see-through */
    color: #fff;
    font: 500 1.125rem/1.35 system-ui, sans-serif;
  }

  #app {
    --c: #2a2a2a; /* current heading colour; grey until the first reading */
    --o: 1;       /* opacity of the colour, set from the menu */
    --dot: 11vmin; /* radius of the corner glow */
    /* Feathered falloff: full colour only at the very centre, fading to
       unlit (see-through) at the rim, with no edge anywhere. */
    --feather:
      var(--c) 0%,
      color-mix(in srgb, var(--c) 90%, #000) 15%,
      color-mix(in srgb, var(--c) 68%, #000) 30%,
      color-mix(in srgb, var(--c) 44%, #000) 45%,
      color-mix(in srgb, var(--c) 24%, #000) 60%,
      color-mix(in srgb, var(--c) 10%, #000) 75%,
      color-mix(in srgb, var(--c) 3%, #000) 88%,
      #000 100%;
    position: relative;
    display: grid;
    place-items: center;
  }

  /* The live view. It is a button so a pinch/tap opens the menu. */
  #surface {
    position: absolute;
    inset: 0;
    inline-size: 100%;
    block-size: 100%;
    margin: 0;
    padding: 0;
    border: 0;
    outline: none; /* the only control on screen, so no focus ring over the colour */
    background: none;
    cursor: pointer;
  }

  /* The colour itself, on its own layer so opacity does not dim the label. */
  #surface::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: var(--o);
    background: var(--c);
  }

  #app[data-style="ring"] #surface::before {
    background: radial-gradient(circle closest-side,
      #0000 70%, var(--c) 71.5%, var(--c) 95%, #0000 96.5%);
  }

  #app[data-style="glow"] #surface::before {
    background: radial-gradient(circle closest-side, var(--feather));
  }

  /* A small feathered dot tucked into the bottom-right corner. */
  #app[data-style="corner"] #surface::before {
    background: radial-gradient(
      circle var(--dot) at calc(100% - var(--dot)) calc(100% - var(--dot)),
      var(--feather));
  }

  /* Small white readout in the bottom-right corner. The black backing is
     unlit, so it only shows as a notch when the colour fills the display. */
  #label {
    position: absolute;
    inset-inline-end: 0.375rem;
    inset-block-end: 0.375rem;
    padding: 0.2rem 0.5rem;
    border-radius: 0.5rem;
    background: #000;
    color: #fff;
    font: 600 1.125rem/1.2 system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
  }

  /* The corner glow takes the corner, so the readout sits just left of it. */
  #app[data-style="corner"] #label {
    inset-inline-end: calc(2 * var(--dot));
  }

  #app[data-label="off"] #label, #label:empty { display: none; }

  .panel {
    position: relative;
    z-index: 1;
    display: grid;
    gap: 0.75rem;
    inline-size: min(76%, 22rem);
    padding: 1.25rem;
    text-align: center;
    background: #000;
    border: 2px solid #ffffff40;
    border-radius: 1.25rem;
    max-block-size: calc(100% - 1.5rem);
    overflow-y: auto;
  }

  h1 { margin: 0; font-size: 1.5rem; }
  p { margin: 0; color: #ddd; }

  .panel button {
    min-block-size: 3rem;
    padding: 0.6rem 1rem;
    font: inherit;
    color: #fff;
    background: #1c1c1c;
    border: 2px solid #ffffff66;
    border-radius: 999px;
    cursor: pointer;
  }

  .panel button:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 3px;
    background: #3a3a3a;
  }

  .stepper {
    display: grid;
    grid-template-columns: 4rem minmax(0, 1fr) 4rem;
    align-items: center;
    gap: 0.5rem;
  }

  .stepper button { padding-inline: 0; font-size: 1.5rem; line-height: 1; }
  .stepper button[aria-disabled="true"] { opacity: 0.4; }
</style>
</head>
<body>
<main id="app" data-style="glow" data-label="on">

  <section id="start" class="panel">
    <h1>Compass Colour</h1>
    <p>Blue is north, orange is south. Uses the motion sensors to read your heading.</p>
    <button type="button" id="start-btn">Start</button>
  </section>

  <button type="button" id="surface" aria-label="Open menu" hidden><span id="label"></span></button>

  <section id="menu" class="panel" aria-label="Menu" hidden>
    <button type="button" id="style-btn"></button>
    <div class="stepper" role="group" aria-label="Opacity">
      <button type="button" id="opacity-down" aria-label="Decrease opacity">&minus;</button>
      <output id="opacity-out"></output>
      <button type="button" id="opacity-up" aria-label="Increase opacity">+</button>
    </div>
    <button type="button" id="label-btn"></button>
    <button type="button" id="north-btn">Set north to here</button>
    <button type="button" id="reset-btn">Reset north</button>
    <button type="button" id="flip-btn">Reverse direction</button>
    <button type="button" id="close-btn">Close</button>
  </section>

  <section id="stale" class="panel" hidden>
    <p id="stale-msg">No compass data.</p>
    <button type="button" id="retry-btn">Try again</button>
    <button type="button" id="demo-btn">Demo sweep</button>
  </section>

</main>

<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const app = $('app');
  const surface = $('surface');
  const label = $('label');
  const menu = $('menu');

  const D2R = Math.PI / 180;
  const SMOOTH_MS = 120;   // low-pass time constant for the heading
  const STALE_MS = 2500;   // no readings for this long = show the fallback
  const RENDER_MS = 33;    // repaint at most ~30 times a second
  const finite = (v) => typeof v === 'number' && Number.isFinite(v);
  const wrap = (deg) => ((deg % 360) + 360) % 360;

  // ---------------------------------------------------------------- colour

  // Heading (degrees clockwise from north) -> hue on the HSL colour wheel.
  // One degree of heading is one degree of hue, so the wheel is spread evenly
  // and opposite headings get opposite (complementary) colours:
  //   N azure blue (210), E green (120), S orange (30), W magenta (300).
  // Change NORTH_HUE to rotate the whole wheel; use "+ wrap(heading)" to put
  // green on the west side instead.
  const NORTH_HUE = 210;

  function headingToHue(heading) {
    return wrap(NORTH_HUE - wrap(heading));
  }

  // ---------------------------------------------------------------- sensor

  // alpha/beta/gamma -> compass heading of the direction the wearer faces.
  // The docs do not say how the device frame sits on the head, so this takes
  // the horizontal direction of (device +Y) + (device -Z). That gives the
  // right answer both when the frame is "flat" (Z up, Y forward) and when it
  // is "upright" (Y up, -Z forward), across roughly +-45 degrees of head
  // pitch. Any other mounting shows up as a fixed offset, which "Set north
  // to here" removes.
  function headingFromEuler(alpha, beta, gamma) {
    const a = alpha * D2R, b = beta * D2R, g = gamma * D2R;
    const cA = Math.cos(a), sA = Math.sin(a);
    const cB = Math.cos(b), sB = Math.sin(b);
    const cG = Math.cos(g), sG = Math.sin(g);
    const east = -cB * sA - cG * sA * sB - cA * sG;
    const north = cA * cB - sA * sG + cA * cG * sB;
    if (Math.hypot(east, north) < 0.2) return null; // facing straight up/down
    return wrap(Math.atan2(east, north) / D2R);
  }

  // ---------------------------------------------------------------- state

  const store = {
    get(key, fallback) {
      try { return localStorage.getItem(key) ?? fallback; } catch { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem(key, value); } catch { /* storage can fail */ }
    },
  };

  const STYLES = ['glow', 'corner', 'fill', 'ring'];
  let style = STYLES.includes(store.get('cc.style', 'glow')) ? store.get('cc.style', 'glow') : 'glow';
  // Which way alpha counts. The W3C spec says counter-clockwise, but on the
  // glasses the heading ran backwards with that, so clockwise is the default.
  // "Reverse direction" in the menu switches it.
  let alphaClockwise = store.get('cc.alpha', 'cw') !== 'ccw';
  let showLabel = store.get('cc.label', 'on') !== 'off';
  const clampOpacity = (v) => Math.min(100, Math.max(10, Math.round(v / 10) * 10));
  let opacity = clampOpacity(Number(store.get('cc.opacity', '100')) || 100);
  let offsetAbs = Number(store.get('cc.north', '0')) || 0; // compass-grade source
  let offsetRel = 0; // relative source: its zero changes every session

  let screen = 'start'; // 'start' | 'live' | 'stale'
  let menuOpen = false;
  let listening = false;
  let sim = null; // { fixed: degrees } or { sweep: true }

  let vx = 0, vy = 1;          // smoothed raw heading as a unit-ish vector
  let haveReading = false;
  let isAbsolute = false;
  let lastReadingAt = 0;
  let lastAbsoluteAt = -Infinity;
  let shownLabel = null;
  let lastRenderAt = -Infinity;

  function pushReading(raw, absolute) {
    const now = performance.now();
    if (absolute) lastAbsoluteAt = now;
    else if (now - lastAbsoluteAt < 1000) return; // prefer the absolute source

    const x = Math.sin(raw * D2R), y = Math.cos(raw * D2R);
    if (!haveReading || absolute !== isAbsolute) {
      vx = x; vy = y;
    } else {
      const k = 1 - Math.exp(-(now - lastReadingAt) / SMOOTH_MS);
      vx += (x - vx) * k;
      vy += (y - vy) * k;
    }
    haveReading = true;
    isAbsolute = absolute;
    lastReadingAt = now;
    if (screen === 'stale') setScreen('live');
    render(now);
  }

  function rawHeading() {
    return wrap(Math.atan2(vx, vy) / D2R);
  }

  function onOrientation(event) {
    if (sim) return;
    if (finite(event.webkitCompassHeading)) { // iOS Safari, for phone testing
      pushReading(event.webkitCompassHeading, true);
      return;
    }
    if (!finite(event.alpha) || !finite(event.beta) || !finite(event.gamma)) return;
    const alpha = alphaClockwise ? -event.alpha : event.alpha;
    const raw = headingFromEuler(alpha, event.beta, event.gamma);
    if (raw !== null) pushReading(raw, event.absolute === true);
  }

  function attachSensors() {
    if (listening) return;
    if ('ondeviceorientationabsolute' in window) {
      window.addEventListener('deviceorientationabsolute', onOrientation);
    }
    window.addEventListener('deviceorientation', onOrientation);
    listening = true;
  }

  async function start() {
    if (!sim) {
      const orientation = window.DeviceOrientationEvent;
      const motion = window.DeviceMotionEvent;
      if (!orientation) {
        showStale('This browser has no orientation sensor.');
        return;
      }
      const owner =
        typeof orientation.requestPermission === 'function' ? orientation
        : typeof motion?.requestPermission === 'function' ? motion
        : null;
      try {
        const state = owner ? await owner.requestPermission() : 'granted';
        if (state !== 'granted') {
          showStale('Sensor access was not granted.');
          return;
        }
      } catch {
        showStale('Sensor access is unavailable.');
        return;
      }
      attachSensors();
    }
    lastReadingAt = performance.now();
    setScreen('live');
    keepAwake();
  }

  async function keepAwake() {
    try { await navigator.wakeLock?.request('screen'); } catch { /* optional */ }
  }

  // ---------------------------------------------------------------- screens

  function setScreen(next) {
    screen = next;
    $('start').hidden = next !== 'start';
    $('stale').hidden = next !== 'stale';
    surface.hidden = next !== 'live';
    if (next !== 'live') menu.hidden = true;
    if (next === 'live') (menuOpen ? $('style-btn') : surface).focus();
    if (next === 'start') $('start-btn').focus();
    if (next === 'stale') $('retry-btn').focus();
  }

  function showStale(message) {
    $('stale-msg').textContent = message;
    if (menuOpen) history.back();
    setScreen('stale');
  }

  function setMenu(open) {
    menuOpen = open;
    menu.hidden = !open || screen !== 'live';
    surface.inert = open;
    if (screen === 'live') (open ? $('style-btn') : surface).focus();
  }

  // Back closes the menu: opening it adds one history entry.
  function openMenu() {
    if (menuOpen || screen !== 'live') return;
    history.pushState({ menu: true }, '');
    setMenu(true);
  }

  function closeMenu() {
    if (menuOpen) history.back();
  }

  function applySettings() {
    app.dataset.style = style;
    app.dataset.label = showLabel ? 'on' : 'off';
    $('style-btn').textContent = `Style: ${style[0].toUpperCase()}${style.slice(1)}`;
    $('label-btn').textContent = `Heading label: ${showLabel ? 'On' : 'Off'}`;
    app.style.setProperty('--o', String(opacity / 100));
    $('opacity-out').textContent = `Opacity ${opacity}%`;
    // At a limit the button stays focusable (so focus is not lost) but dims.
    $('opacity-down').setAttribute('aria-disabled', String(opacity <= 10));
    $('opacity-up').setAttribute('aria-disabled', String(opacity >= 100));
  }

  // ---------------------------------------------------------------- render

  const POINTS = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];

  // Called from the sensor stream, at most once per RENDER_MS.
  function render(now) {
    if (screen !== 'live' || !haveReading || now - lastRenderAt < RENDER_MS) return;
    lastRenderAt = now;
    const heading = wrap(rawHeading() + (isAbsolute ? offsetAbs : offsetRel));
    app.style.setProperty('--c', `hsl(${headingToHue(heading).toFixed(1)} 100% 50%)`);
    const degrees = Math.round(heading) % 360;
    const text = `${POINTS[Math.round(heading / 45) % 8]} ${degrees}°${isAbsolute ? '' : ' rel'}`;
    if (text !== shownLabel) {
      label.textContent = text;
      shownLabel = text;
    }
  }

  setInterval(() => {
    if (sim && screen === 'live') {
      pushReading(sim.sweep ? (performance.now() / 1000) * 30 : sim.fixed, true);
    }
  }, RENDER_MS);

  setInterval(() => {
    if (screen === 'live' && !sim && performance.now() - lastReadingAt > STALE_MS) {
      haveReading = false;
      showStale('No compass data.');
    }
  }, 500);

  // ---------------------------------------------------------------- wiring

  $('start-btn').addEventListener('click', start);
  $('retry-btn').addEventListener('click', start);
  $('demo-btn').addEventListener('click', () => {
    sim = { sweep: true };
    start();
  });

  surface.addEventListener('click', openMenu);
  $('close-btn').addEventListener('click', closeMenu);

  $('style-btn').addEventListener('click', () => {
    style = STYLES[(STYLES.indexOf(style) + 1) % STYLES.length];
    store.set('cc.style', style);
    applySettings();
  });

  function setOpacity(value) {
    opacity = clampOpacity(value);
    store.set('cc.opacity', String(opacity));
    applySettings();
  }

  $('opacity-down').addEventListener('click', () => setOpacity(opacity - 10));
  $('opacity-up').addEventListener('click', () => setOpacity(opacity + 10));

  $('label-btn').addEventListener('click', () => {
    showLabel = !showLabel;
    store.set('cc.label', showLabel ? 'on' : 'off');
    applySettings();
  });

  $('north-btn').addEventListener('click', () => {
    if (haveReading) {
      const offset = wrap(-rawHeading());
      if (isAbsolute) {
        offsetAbs = offset;
        store.set('cc.north', String(offset));
      } else {
        offsetRel = offset;
      }
    }
    closeMenu();
  });

  $('reset-btn').addEventListener('click', () => {
    offsetAbs = 0;
    offsetRel = 0;
    store.set('cc.north', '0');
    closeMenu();
  });

  // Mirrors the compass about north, so a saved north stays where it is.
  $('flip-btn').addEventListener('click', () => {
    alphaClockwise = !alphaClockwise;
    store.set('cc.alpha', alphaClockwise ? 'cw' : 'ccw');
    offsetAbs = wrap(-offsetAbs);
    offsetRel = wrap(-offsetRel);
    store.set('cc.north', String(offsetAbs));
    vx = -vx;
    closeMenu();
  });

  window.addEventListener('popstate', (event) => setMenu(event.state?.menu === true));

  // If focus was lost, Enter (pinch) still opens the menu.
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && screen === 'live' && !menuOpen &&
        document.activeElement === document.body) {
      openMenu();
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && screen === 'live') keepAwake();
  });

  // ?sim sweeps through every heading, ?sim=135 pins one. For desktop preview.
  const simParam = new URLSearchParams(location.search).get('sim');
  if (simParam !== null) {
    sim = simParam !== '' && finite(Number(simParam)) ? { fixed: Number(simParam) } : { sweep: true };
  }

  history.replaceState({ menu: false }, '');
  applySettings();
  setScreen('start');
})();
</script>
</body>
</html>
